<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9a3412">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>شهيّ - اطلب وجبتك</title>
<style>
:root{--br:#c2410c;--br2:#9a3412;--bg:#fbf7f2;--card:#fff;--ink:#2a1f1a;--mute:#8a7b72;--ln:#eadfd5;--ok:#15803d;--red:#b91c1c;--r:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Tahoma,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;padding-bottom:84px}
button{font:inherit;cursor:pointer;border:0}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:12px;background:#fff;color:var(--ink)}
:focus-visible{outline:2px solid var(--br);outline-offset:2px}
label{display:block;font-size:12px;font-weight:700;margin:10px 0 4px;color:#5b4a41}
.wrap{max-width:1050px;margin:auto;padding:0 14px}
header{position:sticky;top:0;z-index:20;background:rgba(251,247,242,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln);padding-top:env(safe-area-inset-top)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0}
.logo{display:flex;align-items:center;gap:10px;user-select:none}
.logo b{width:42px;height:42px;border-radius:13px;background:var(--br);color:#fff;display:grid;place-items:center;font-size:22px}
.logo h1{font-size:19px;line-height:1.2}.logo small{color:var(--mute);font-size:11px}
.cartb{background:var(--br);color:#fff;border-radius:12px;padding:9px 14px;font-weight:700;display:flex;gap:8px;align-items:center}
.cartb span{background:#fff;color:var(--br);border-radius:99px;padding:0 8px;font-size:12px;min-width:22px;text-align:center}
.search{padding-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 14px;border-radius:99px;background:#fff;border:1px solid var(--ln);color:#5b4a41;font-weight:700;font-size:13px}
.chip.on{background:var(--br);border-color:var(--br);color:#fff}
.hero{margin:14px 0;padding:20px;border-radius:22px;background:linear-gradient(135deg,var(--br2),#d97706);color:#fff}
.hero h2{font-size:22px;margin-bottom:4px}.hero p{opacity:.92;font-size:14px}
.closed{background:#fee2e2;color:var(--red);padding:10px 14px;border-radius:12px;font-weight:700;margin-bottom:12px;text-align:center}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.it{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.ph{height:150px;background:#f6ece3;display:grid;place-items:center;font-size:56px;position:relative}
.ph img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:10px;right:10px;background:rgba(42,31,26,.82);color:#fff;font-size:11px;padding:2px 9px;border-radius:8px}
.bd{padding:12px;flex:1}.bd h3{font-size:16px}.bd p{font-size:12.5px;color:var(--mute);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ft{display:flex;justify-content:space-between;align-items:center;padding:0 12px 12px}
.pr{font-size:19px;font-weight:800}.pr small{font-size:12px;color:var(--br)}
.add{background:var(--br);color:#fff;border-radius:12px;width:42px;height:42px;font-size:22px;font-weight:700}
.add:disabled,.na{background:#d6ccc4;color:#fff}.na{padding:8px 12px;border-radius:10px;font-size:12px;font-weight:700}
.empty{text-align:center;padding:50px 10px;color:var(--mute)}
.bar{position:fixed;bottom:0;left:0;right:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);z-index:15;display:none}
.bar button{width:100%;max-width:600px;margin:auto;display:flex;justify-content:space-between;background:var(--br2);color:#fff;padding:14px 18px;border-radius:16px;font-weight:700;box-shadow:0 8px 24px rgba(154,52,18,.35)}
#ov{position:fixed;inset:0;background:rgba(42,31,26,.55);z-index:40;display:none;align-items:flex-end;justify-content:center}
#ov.on{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){#ov{align-items:center}.sheet{border-radius:22px}}
.sheet h3{font-size:18px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.x{background:#f3ebe4;border-radius:50%;width:32px;height:32px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--ln)}.row:first-of-type{border-top:0}
.row .th{width:54px;height:54px;border-radius:12px;background:#f6ece3;display:grid;place-items:center;font-size:26px;overflow:hidden;flex:none}.th img{width:100%;height:100%;object-fit:cover}
.row .m{flex:1;min-width:0}.row .m b{display:block;font-size:14px}.row .m span{font-size:12px;color:var(--mute)}
.qty{display:flex;align-items:center;gap:8px;background:#f6ece3;border-radius:10px;padding:3px}.qty button{width:28px;height:28px;border-radius:8px;background:#fff;font-weight:800}
.sum div{display:flex;justify-content:space-between;font-size:14px;margin-top:6px;color:#5b4a41}.sum .t{font-size:17px;font-weight:800;color:var(--ink);border-top:1px solid var(--ln);padding-top:8px}
.btn{width:100%;padding:13px;border-radius:14px;font-weight:700;background:var(--br);color:#fff;margin-top:14px}.btn.wa{background:#16a34a}.btn.g{background:#efe6de;color:var(--ink)}.btn.r{background:#fee2e2;color:var(--red)}
.btn:disabled{background:#d6ccc4}
.sm{padding:6px 11px;border-radius:9px;font-size:12px;font-weight:700;background:#efe6de;color:var(--ink);width:auto;margin:0}.sm.r{background:#fee2e2;color:var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1;padding:9px;border-radius:10px;background:#efe6de;font-weight:700;font-size:13px}.tabs .on{background:var(--br);color:#fff}
.note{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:10px;font-size:12.5px;margin:8px 0}
.sw{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px}.sw input{width:auto}
.pv{width:100%;height:130px;object-fit:cover;border-radius:12px;margin-top:8px}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#2a1f1a;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}#toast.on{opacity:1}
footer{text-align:center;color:var(--mute);font-size:12px;padding:20px}
.owner{position:fixed;top:0;right:0;left:0;background:#2a1f1a;color:#fff;font-size:12px;padding:5px 12px;z-index:30;display:none;justify-content:space-between}.owner button{background:none;color:#fbbf24;font-weight:700}
</style>
</head>
<body>
<div class="owner" id="ownerBar"><span>وضع المالك مفعّل</span><button id="ownerOpen">لوحة التحكم</button></div>
<header><div class="wrap">
 <div class="hd">
  <div class="logo" id="logo"><b>🍽</b><div><h1 id="shopName">شهيّ</h1><small id="shopTag"></small></div></div>
  <button class="cartb" id="cartBtn">🛒 <span id="cartN">0</span></button>
 </div>
 <div class="search"><input id="q" type="search" placeholder="ابحث عن وجبة..." autocomplete="off"></div>
</div></header>

<main class="wrap">
 <div id="closedMsg" class="closed" hidden>المطعم مغلق حالياً، يمكنك تصفح القائمة وسنفتح قريباً</div>
 <div class="hero" id="hero"><h2></h2><p></p></div>
 <div class="chips" id="chips"></div>
 <div class="grid" id="grid"></div>
 <div class="empty" id="empty" hidden><div style="font-size:44px">🍽</div><b>لا توجد وجبات مطابقة</b></div>
</main>
<footer id="foot"></footer>

<div class="bar" id="bar"><button id="barBtn"><span id="barN"></span><span>عرض السلة</span><span id="barT"></span></button></div>
<div id="ov"></div><div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const CATS=[['all','الكل','🍽'],['fastfood','وجبات سريعة','🍔'],['pizza','بيتزا','🍕'],['grills','مشويات','🍢'],['main','أطباق رئيسية','🍛'],['drinks','مشروبات','🥤'],['sweets','حلويات','🍰']];
const EMO=Object.fromEntries(CATS.map(c=>[c[0],c[2]]));
const DEF={settings:{name:'شهيّ',tagline:'أطيب المأكولات حتى باب بيتك',offer:'',phone:'201000000000',fee:15,freeFrom:0,open:true},items:[
 {id:1,name:'برجر كلاسيك دبل شيدر',cat:'fastfood',price:140,time:'20-25 دقيقة',desc:'قطعتان من لحم البقر المشوي مع جبنة الشيدر والخس والطماطم والصلصة الخاصة.',img:'',on:true},
 {id:2,name:'بيتزا سوبر سوبريم',cat:'pizza',price:180,time:'25-30 دقيقة',desc:'عجينة هشة بصلصة الطماطم والببروني والسلامي والفلفل والزيتون وجبنة الموزاريلا.',img:'',on:true},
 {id:3,name:'كباب وكفتة مشوية',cat:'grills',price:260,time:'30-40 دقيقة',desc:'كباب وكفتة بلدي على الفحم مع أرز بالخلطة وطحينة وخبز بلدي.',img:'',on:true},
 {id:4,name:'دجاج كريسبي حار',cat:'fastfood',price:130,time:'15-20 دقيقة',desc:'4 قطع دجاج مقرمش حار مع بطاطس وكول سلو وثومية.',img:'',on:true},
 {id:5,name:'عصير مانجو طازج',cat:'drinks',price:45,time:'10 دقائق',desc:'مانجو طبيعي 100% بدون مواد حافظة.',img:'',on:true},
 {id:6,name:'مولتن كيك بالفراولة',cat:'sweets',price:75,time:'15 دقيقة',desc:'كيك شوكولاتة ذائبة مع آيس كريم فانيليا وفراولة.',img:'',on:true}]};

let data=LS.get('sh_data',null)||DEF, owner=false, cat='all', cart=LS.get('sh_cart',{});
const S=()=>data.settings, money=n=>(+n).toLocaleString('en-US')+' ج.م';
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2300)}

// ---- modal ----
function modal(html){$('ov').innerHTML=`<div class="sheet">${html}</div>`;$('ov').classList.add('on')}
function closeM(){$('ov').classList.remove('on');$('ov').innerHTML=''}
$('ov').addEventListener('click',e=>{if(e.target.id==='ov'||e.target.closest('[data-close]'))closeM()});
const head=t=>`<h3><span>${t}</span><button class="x" data-close>✕</button></h3>`;

// ---- load published menu ----
async function boot(){
  if(!LS.get('sh_data',null)){try{const r=await fetch('menu.json',{cache:'no-store'});if(r.ok){const j=await r.json();if(j&&j.items)data={settings:{...DEF.settings,...j.settings},items:j.items}}}catch(e){}}
  render();
}

// ---- customer UI ----
const cartLines=()=>Object.entries(cart).map(([id,q])=>({it:data.items.find(i=>i.id==id&&i.on),q})).filter(l=>l.it);
const subtotal=()=>cartLines().reduce((s,l)=>s+l.it.price*l.q,0);
const feeFor=sub=>S().freeFrom>0&&sub>=S().freeFrom?0:+S().fee||0;
function render(){
  const s=S();document.title=s.name+' - اطلب وجبتك';$('shopName').textContent=s.name;$('shopTag').textContent=s.tagline;
  $('hero').querySelector('h2').textContent=s.offer||'طازج وساخن ويوصلك بسرعة';$('hero').querySelector('p').textContent=s.freeFrom>0?`توصيل مجاني للطلبات فوق ${money(s.freeFrom)}`:'اختر وجبتك وأرسل طلبك عبر واتساب بضغطة واحدة';
  $('closedMsg').hidden=s.open;$('foot').textContent=s.name;
  const used=new Set(data.items.map(i=>i.cat));
  $('chips').innerHTML=CATS.filter(c=>c[0]==='all'||used.has(c[0])).map(c=>`<button class="chip ${cat===c[0]?'on':''}" data-cat="${c[0]}">${c[2]} ${c[1]}</button>`).join('');
  const q=$('q').value.trim().toLowerCase();
  const list=data.items.filter(i=>(cat==='all'||i.cat===cat)&&(!q||(i.name+' '+i.desc).toLowerCase().includes(q)));
  $('grid').innerHTML=list.map(i=>`<div class="it"><div class="ph">${i.img?`<img src="${i.img}" alt="${esc(i.name)}" loading="lazy">`:EMO[i.cat]||'🍽'}${i.time?`<span class="tag">⏱ ${esc(i.time)}</span>`:''}</div>
   <div class="bd"><h3>${esc(i.name)}</h3><p>${esc(i.desc)}</p></div>
   <div class="ft"><div class="pr">${(+i.price).toLocaleString('en-US')} <small>ج.م</small></div>${i.on&&s.open?`<button class="add" data-add="${i.id}" aria-label="إضافة ${esc(i.name)}">+</button>`:`<span class="na">${i.on?'مغلق':'غير متاح'}</span>`}</div></div>`).join('');
  $('empty').hidden=list.length>0;
  const n=cartLines().reduce((a,l)=>a+l.q,0),sub=subtotal();
  $('cartN').textContent=n;$('bar').style.display=n?'block':'none';$('barN').textContent=n+' وجبة';$('barT').textContent=money(sub);
  $('ownerBar').style.display=owner?'flex':'none';
}
function setQty(id,d){const q=(cart[id]||0)+d;if(q<=0)delete cart[id];else cart[id]=q;LS.set('sh_cart',cart);render();if($('ov').classList.contains('on')&&$('ov').querySelector('[data-cartview]'))openCart()}
function openCart(){
  const L=cartLines(),sub=subtotal(),fee=feeFor(sub);
  if(!L.length){modal(head('سلة الطلب')+'<div class="empty"><div style="font-size:40px">🛒</div>السلة فارغة</div>');return}
  modal(head('سلة الطلب')+`<div data-cartview>${L.map(l=>`<div class="row"><div class="th">${l.it.img?`<img src="${l.it.img}" alt="">`:EMO[l.it.cat]||'🍽'}</div><div class="m"><b>${esc(l.it.name)}</b><span>${money(l.it.price)}</span></div><div class="qty"><button data-q="${l.it.id}" data-d="-1">−</button><b>${l.q}</b><button data-q="${l.it.id}" data-d="1">+</button></div></div>`).join('')}</div>
  <div class="sum"><div><span>الوجبات</span><span>${money(sub)}</span></div><div><span>التوصيل</span><span>${fee?money(fee):'مجاني'}</span></div><div class="t"><span>الإجمالي</span><span>${money(sub+fee)}</span></div></div>
  <button class="btn" data-checkout ${S().open?'':'disabled'}>${S().open?'متابعة وتأكيد الطلب':'المطعم مغلق حالياً'}</button>`);
}
function openCheckout(){
  const c=LS.get('sh_cust',{});
  modal(head('بيانات التوصيل')+`<form id="ckf" novalidate>
   <label>الاسم *</label><input id="cn" value="${esc(c.n)}" autocomplete="name">
   <div class="two"><div><label>رقم الموبايل *</label><input id="cp" type="tel" inputmode="tel" placeholder="01xxxxxxxxx" value="${esc(c.p)}" autocomplete="tel"></div>
   <div><label>الدفع</label><select id="cy"><option>كاش عند الاستلام</option><option>محفظة إلكترونية</option><option>فيزا عند الاستلام</option></select></div></div>
   <label>العنوان بالتفصيل *</label><textarea id="ca" rows="2" placeholder="الشارع، العمارة، الشقة، علامة مميزة">${esc(c.a)}</textarea>
   <label>ملاحظات (اختياري)</label><input id="co" placeholder="بدون بصل، زيادة صوص...">
   <div id="err" style="color:var(--red);font-size:12.5px;margin-top:8px"></div>
   <button class="btn wa" type="submit">إرسال الطلب عبر واتساب</button></form>`);
}
function sendOrder(){
  const n=$('cn').value.trim(),p=$('cp').value.trim().replace(/[\s-]/g,''),a=$('ca').value.trim(),err=$('err');
  if(n.length<2)return err.textContent='اكتب اسمك';
  if(!/^(\+?20|0)?1[0125]\d{8}$/.test(p))return err.textContent='رقم الموبايل غير صحيح (مثال: 01012345678)';
  if(a.length<6)return err.textContent='اكتب العنوان بالتفصيل';
  LS.set('sh_cust',{n,p,a});
  const L=cartLines(),sub=subtotal(),fee=feeFor(sub),no=(LS.get('sh_ord',1000)+1);LS.set('sh_ord',no);
  let m=`*طلب جديد #${no} - ${S().name}*\n------------------\n👤 ${n}\n📞 ${p}\n📍 ${a}\n💳 ${$('cy').value}\n`;
  if($('co').value.trim())m+=`📝 ${$('co').value.trim()}\n`;
  m+=`------------------\n`+L.map(l=>`• ${l.it.name} × ${l.q} = ${money(l.it.price*l.q)}`).join('\n')+`\n------------------\nالوجبات: ${money(sub)}\nالتوصيل: ${fee?money(fee):'مجاني'}\n*الإجمالي: ${money(sub+fee)}*`;
  let ph=String(S().phone).replace(/\D/g,'');if(ph.startsWith('0'))ph='2'+ph;
  window.open(`https://wa.me/${ph}?text=${encodeURIComponent(m)}`,'_blank');
  cart={};LS.set('sh_cart',cart);closeM();render();toast('تم تجهيز الطلب #'+no);
}

// ---- owner ----
let taps=0,tt;
$('logo').onclick=()=>{taps++;clearTimeout(tt);tt=setTimeout(()=>taps=0,2500);if(taps>=5){taps=0;owner?openOwner():askPin()}};
$('ownerOpen').onclick=()=>openOwner();
function askPin(){modal(head('دخول المالك')+`<label>الرمز السري</label><input id="pin" type="password" inputmode="numeric" autocomplete="off"><div id="err" style="color:var(--red);font-size:12.5px;margin-top:6px"></div><button class="btn" data-pin>دخول</button>`);setTimeout(()=>$('pin')&&$('pin').focus(),50)}
function checkPin(){if($('pin').value===String(LS.get('sh_pin','1234'))){owner=true;render();openOwner()}else $('err').textContent='الرمز غير صحيح'}
let tab='items';
function openOwner(t){tab=t||tab;const s=S();
 let body='';
 if(tab==='items'){body=(s.phone==='201000000000'?'<div class="note">غيّر رقم واتساب المطعم من تبويب الإعدادات قبل النشر.</div>':'')+`<button class="btn" data-edit="0" style="margin-top:6px">＋ إضافة وجبة</button>`+
  `<div style="margin-top:8px">${data.items.map(i=>`<div class="row"><div class="th">${i.img?`<img src="${i.img}" alt="">`:EMO[i.cat]||'🍽'}</div><div class="m"><b>${esc(i.name)}</b><span>${money(i.price)} ${i.on?'':'• غير متاح'}</span></div><button class="sm" data-tog="${i.id}">${i.on?'إخفاء':'إظهار'}</button><button class="sm" data-edit="${i.id}">تعديل</button></div>`).join('')||'<div class="empty">لا توجد وجبات</div>'}</div>`}
 else if(tab==='set'){body=`<label>اسم المطعم</label><input id="sn" value="${esc(s.name)}"><label>وصف قصير</label><input id="st" value="${esc(s.tagline)}"><label>عبارة العرض (تظهر في الواجهة)</label><input id="so" placeholder="مثال: خصم خاص لفترة محدودة" value="${esc(s.offer)}">
  <div class="two"><div><label>واتساب المطعم (بكود الدولة)</label><input id="sp" inputmode="tel" value="${esc(s.phone)}"></div><div><label>رسوم التوصيل (ج.م)</label><input id="sf" type="number" inputmode="decimal" value="${esc(s.fee)}"></div></div>
  <label>توصيل مجاني فوق مبلغ (0 = معطّل)</label><input id="sm" type="number" inputmode="decimal" value="${esc(s.freeFrom)}">
  <div class="sw"><input type="checkbox" id="so2" ${s.open?'checked':''}><label style="margin:0" for="so2">المطعم يستقبل الطلبات الآن</label></div>
  <label>تغيير الرمز السري (اتركه فارغاً بدون تغيير)</label><input id="sx" type="password" inputmode="numeric"><button class="btn" data-saveset>حفظ الإعدادات</button>`}
 else{body=`<div class="note">القائمة محفوظة على هذا الجهاز فقط. ليراها العملاء: حمّل ملف <b>menu.json</b> ثم ارفعه على GitHub في نفس مجلد index.html (استبدل القديم).</div>
  <button class="btn" data-exp>⬇ تصدير menu.json للنشر</button><button class="btn g" data-imp>⬆ استيراد menu.json</button><input type="file" id="fi" accept=".json" hidden>
  <button class="btn r" data-reset>إلغاء تعديلاتي والعودة للقائمة المنشورة</button>`}
 modal(head('لوحة المالك')+`<div class="tabs"><button class="${tab==='items'?'on':''}" data-tab="items">الوجبات</button><button class="${tab==='set'?'on':''}" data-tab="set">الإعدادات</button><button class="${tab==='pub'?'on':''}" data-tab="pub">النشر</button></div>`+body);
 if(tab==='pub')$('fi').onchange=impFile;
}
function persist(){if(!LS.set('sh_data',data))toast('المساحة ممتلئة: صغّر الصور أو احذف وجبات')}
function itemForm(id){const it=data.items.find(i=>i.id==id)||{name:'',cat:'fastfood',price:'',time:'',desc:'',img:'',on:true};
 modal(head(id?'تعديل وجبة':'وجبة جديدة')+`<form id="itf" novalidate><label>اسم الوجبة *</label><input id="in" value="${esc(it.name)}">
 <div class="two"><div><label>القسم</label><select id="ic">${CATS.slice(1).map(c=>`<option value="${c[0]}" ${c[0]===it.cat?'selected':''}>${c[2]} ${c[1]}</option>`).join('')}</select></div><div><label>السعر (ج.م) *</label><input id="ip" type="number" inputmode="decimal" min="0" value="${esc(it.price)}"></div></div>
 <label>وقت التحضير</label><input id="it" placeholder="20-25 دقيقة" value="${esc(it.time)}"><label>الوصف</label><textarea id="id" rows="3">${esc(it.desc)}</textarea>
 <label>الصورة (اختياري)</label><input id="ii" type="file" accept="image/*"><img id="pv" class="pv" ${it.img?`src="${it.img}"`:'hidden'} alt=""><input type="hidden" id="iv" value="${it.img?'1':''}">
 <div class="sw"><input type="checkbox" id="ia" ${it.on?'checked':''}><label style="margin:0" for="ia">متاحة للطلب</label></div><div id="err" style="color:var(--red);font-size:12.5px;margin-top:6px"></div>
 <button class="btn" type="submit">حفظ</button>${id?`<button class="btn r" type="button" data-del="${id}">حذف الوجبة</button>`:''}<button class="btn g" type="button" data-tab="items">رجوع</button></form>`);
 let img=it.img||'';
 $('ii').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{img=await compress(f);$('pv').src=img;$('pv').hidden=false}catch(x){toast('تعذر قراءة الصورة')}};
 $('itf').onsubmit=e=>{e.preventDefault();const name=$('in').value.trim(),price=parseFloat($('ip').value);
  if(!name)return $('err').textContent='اكتب اسم الوجبة';if(!(price>=0))return $('err').textContent='اكتب السعر';
  const o={id:it.id||Date.now(),name,cat:$('ic').value,price,time:$('it').value.trim(),desc:$('id').value.trim(),img,on:$('ia').checked};
  const k=data.items.findIndex(i=>i.id==o.id);k>=0?data.items[k]=o:data.items.push(o);persist();render();openOwner('items');toast('تم الحفظ')};
}
function compress(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.7))};im.onerror=rej;im.src=u})}
async function expFile(){const blob=new Blob([JSON.stringify({settings:data.settings,items:data.items})],{type:'application/json'});
 try{const f=new File([blob],'menu.json',{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='menu.json';document.body.appendChild(a);a.click();a.remove();toast('تم تنزيل menu.json')}
function impFile(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.items))throw 0;data={settings:{...DEF.settings,...j.settings},items:j.items};persist();render();toast('تم الاستيراد')}catch(x){toast('ملف غير صالح')}};r.readAsText(f)}
function saveSet(){const s=S();s.name=$('sn').value.trim()||'شهيّ';s.tagline=$('st').value.trim();s.offer=$('so').value.trim();s.phone=$('sp').value.replace(/\D/g,'')||s.phone;s.fee=Math.max(0,parseFloat($('sf').value)||0);s.freeFrom=Math.max(0,parseFloat($('sm').value)||0);s.open=$('so2').checked;
 const px=$('sx').value.trim();if(px){if(px.length<4)return toast('الرمز 4 أرقام على الأقل');LS.set('sh_pin',px)}persist();render();toast('تم حفظ الإعدادات')}

// ---- events ----
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.cat){cat=d.cat;render()}else if(d.add){setQty(+d.add,1);toast('أضيفت للسلة')}
 else if(d.q)setQty(+d.q,+d.d);else if(d.checkout!==undefined)openCheckout();
 else if(d.pin!==undefined)checkPin();else if(d.tab)openOwner(d.tab);else if(d.edit!==undefined)itemForm(+d.edit||0);
 else if(d.tog){const i=data.items.find(x=>x.id==d.tog);i.on=!i.on;persist();render();openOwner('items')}
 else if(d.del){if(confirm('حذف هذه الوجبة نهائياً؟')){data.items=data.items.filter(i=>i.id!=d.del);delete cart[d.del];persist();render();openOwner('items')}}
 else if(d.saveset!==undefined)saveSet();else if(d.exp!==undefined)expFile();else if(d.imp!==undefined)$('fi').click();
 else if(d.reset!==undefined){if(confirm('سيتم مسح تعديلاتك على هذا الجهاز. متابعة؟')){LS.del('sh_data');location.reload()}}});
document.addEventListener('submit',e=>{if(e.target.id==='ckf'){e.preventDefault();sendOrder()}});
$('cartBtn').onclick=openCart;$('barBtn').onclick=openCart;$('q').oninput=render;
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
boot();
</script>
</body>
</html>
